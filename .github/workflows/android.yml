name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Spiellogik testen
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk sterneversenken.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sterneversenken-apk
          path: sterneversenken.apk

      # Auf main: APK als Release "latest" veröffentlichen, damit man sie direkt
      # auf dem Handy herunterladen kann.
      - name: Release aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sterneversenken.apk \
            --target "$GITHUB_SHA" \
            --title "Sterne versenken – neueste Version" \
            --notes "Build ${GITHUB_RUN_NUMBER} von ${GITHUB_SHA::7}. APK aufs Handy laden und installieren."
